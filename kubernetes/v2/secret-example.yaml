---
# kubernetes/v2/secret-example.yaml
# Create the actual secret with:
#   kubectl create secret generic stream-secrets -n stream \
#     --from-literal=DASHBOARD_USER=admin \
#     --from-literal=DASHBOARD_PASSWORD='<password>' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# This file shows the structure only – do NOT commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: stream-secrets
  namespace: stream
  labels:
    app.kubernetes.io/name: hdw-rtmp
type: Opaque
stringData:
  DASHBOARD_USER: "admin"
  DASHBOARD_PASSWORD: "changeme"           # REPLACE before applying
  JWT_SECRET: "replace-with-32-random-hex" # REPLACE before applying
