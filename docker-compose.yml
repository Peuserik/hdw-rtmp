version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# hdw-rtmp v2 – Docker Compose deployment
#
# Quick start:
#   1. cp .env.example .env && edit .env
#   2. Place TLS certs in ./tls/ (fullchain.pem, privkey.pem)
#   3. docker compose up -d
#
# Stream via RTMP:  rtmp://<host>/live/<key>
# Dashboard:        https://<host>/
# HLS direct URL:   https://<host>/hls/transcoded/<key>_720p/index.m3u8
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MediaMTX: RTMP ingest + HLS output + REST API ──────────────────────────
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"   # RTMP ingest
      - "8554:8554"   # RTSP
      # 8888 and 9997 are internal; exposed only within the Compose network
    environment:
      - RTMP_HOST=mediamtx   # used by transcode.sh
    networks:
      - stream-net

  # ── Dashboard: auth + stream stats UI ────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    environment:
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PORT=3000
    depends_on:
      - mediamtx
    networks:
      - stream-net

  # ── nginx: TLS termination + reverse proxy ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx.new.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - dashboard
      - mediamtx
    networks:
      - stream-net

networks:
  stream-net:
    driver: bridge
