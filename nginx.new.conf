# nginx.new.conf – reverse proxy for the v2 streaming server stack
# Mount this as /etc/nginx/nginx.conf inside the nginx container.
#
# Services proxied:
#   dashboard  :3000  – Node.js dashboard (auth, API, SSE, static files)
#   mediamtx   :8888  – MediaMTX HLS output
#   mediamtx   :9997  – MediaMTX REST API (internal only – not exposed)

worker_processes auto;
daemon off;

events { worker_connections 1024; }

http {
  include      mime.types;
  default_type application/octet-stream;
  sendfile     on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript;

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  server {
    listen      80;
    listen [::]:80;
    server_name _;
    return 301  https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────
  server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 5m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ── Dashboard (login + SSE + static) ──────────────────────────────────
    location / {
      proxy_pass         http://dashboard:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection '';
      proxy_set_header   Host dashboard:3000;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Required for Server-Sent Events
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 24h;
    }

    # ── HLS streams (MediaMTX) ─────────────────────────────────────────────
    location /hls/ {
      add_header Cache-Control  no-cache;
      add_header Access-Control-Allow-Origin *;

      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                     ts;
      }

      # Strip /hls prefix before forwarding to MediaMTX port 8888
      rewrite ^/hls/(.*) /$1 break;
      proxy_pass http://mediamtx:8888;
    }
  }

  # ── Health / readiness (K8s probes) ───────────────────────────────────────
  server {
    listen 8080;
    location /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location /readyz  { return 200 "ok\n"; add_header Content-Type text/plain; }
  }
}
